name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installer and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: VidDownload ${{ github.ref_name }}
          releaseBody: |
            Download `VidDownload_*_x64-setup.exe` below and run it.
            On first launch, click **Install components** to fetch yt-dlp and ffmpeg.

            Builds are not code-signed yet, so Windows SmartScreen or Defender may warn; see the README's Troubleshooting section.
          releaseDraft: true
          prerelease: false
