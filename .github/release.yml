# Sections for GitHub's auto-generated release notes, based on PR labels.
# A PR goes in the first section whose labels match.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: New features
      labels: [enhancement]
    - title: Bug fixes
      labels: [bug]
    - title: Security
      labels: [security]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
