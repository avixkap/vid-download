[package]
name = "vid-download"
version = "1.0.0"
description = "Desktop video downloader powered by yt-dlp"
authors = ["avixkap"]
license = "MIT"
repository = "https://github.com/avixkap/vid-download"
homepage = "https://github.com/avixkap/vid-download"
edition = "2021"
rust-version = "1.77"

[lib]
name = "vid_download_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"

[profile.release]
lto = "thin"
opt-level = "s"
codegen-units = 1
strip = true
panic = "abort"
